                subtitleContainer.addEventListener('click', (e) => {
                    const subtitleLine = e.target && e.target.closest ? e.target.closest('.subtitle-line') : null;
                    if (!subtitleLine) return;
                    if (contentSwitchInProgress) {
                        liminalTrace('ui:subtitle-click:blocked', { reason: 'contentSwitchInProgress' });
                        e.preventDefault();
                        e.stopPropagation();
                        if (typeof e.stopImmediatePropagation === 'function') e.stopImmediatePropagation();
                        return;
                    }
                    if (eventPointInMobileRecenterZone(e)) {
                        liminalTrace('ui:subtitle-click:blocked', { reason: 'mobileRecenterZone' });
                        e.preventDefault();
                        e.stopPropagation();
                        if (typeof e.stopImmediatePropagation === 'function') e.stopImmediatePropagation();
                        handleRecenterActivate(e);
                        return;
                    }
                    if (Date.now() < suppressSubtitleClickUntil) {
                        liminalTrace('ui:subtitle-click:blocked', { reason: 'suppressSubtitleClickUntil' });
                        e.preventDefault();
                        e.stopPropagation();
                        if (typeof e.stopImmediatePropagation === 'function') e.stopImmediatePropagation();
                        return;
                    }
                    liminalTrace('ui:subtitle-click:ok');
                    setSubtitleFollowLocked(false);
                }, true);

                // PRELOAD IMMEDIATELY - WRAPPED
                try {
                    if (window.audioPlayer && window.audioPlayer.audio) {
                        window.audioPlayer.audio.preload = "auto";
                        // window.audioPlayer.audio.load(); 
                        console.log("Liminal Audio Preloading...");
                    }
                } catch (e) { console.warn("Liminal Preload Failed", e); }

                // Initialize Game
                (async () => {
                    try {
                        // 2. Load Audio State
                        const savedState = PlayerStateManager.getState('liminal_library');
                        if (savedState && savedState.sentenceTime > 0) {
                            player.audio.currentTime = savedState.sentenceTime;
                        }

                        // 3. Init Visibility Manage - DISABLED (Bug suspected)
                        // AudioVisibilityManager.init(player.audio);

                    } catch (e) {
                        console.error("Game Init Error:", e);
                    }
                })();

                // --- UI HELPERS ---
                function hideNextChapterPrompt(reason = 'auto-hide') {
                    if (!nextChapterBtn) return;
                    nextChapterBtn.classList.remove('visible');
                    nextChapterBtn.style.removeProperty('--next-btn-top');
                    nextChapterPromptActive = false;
                    nextChapterPromptTrackbackReference = NaN;
                    liminalTrace('ui:next-chapter:hide', { reason });
                }

                function getSubtitleVisualTop() {
                    if (!subtitleContainer) return NaN;
                    const lines = subtitleContainer.querySelectorAll('.subtitle-line');
                    if (!lines || !lines.length) return NaN;
                    let minTop = Infinity;
                    lines.forEach((line) => {
                        if (!line || typeof line.getBoundingClientRect !== 'function') return;
                        const rect = line.getBoundingClientRect();
                        if (!rect || rect.width <= 1 || rect.height <= 1) return;
                        minTop = Math.min(minTop, rect.top);
                    });
                    return Number.isFinite(minTop) ? minTop : NaN;
                }

                function positionNextChapterPrompt() {
                    if (!nextChapterBtn || !nextChapterBtn.classList.contains('visible')) return;
                    if (isReadingMode) return;

                    const btnHeight = Math.max(40, Number(nextChapterBtn.offsetHeight) || 0);
                    const subtitleTop = getSubtitleVisualTop();
                    const fallbackTop = window.innerHeight * (isEffectiveMobileLayout() ? 0.34 : 0.28);
                    let targetTop = Number.isFinite(subtitleTop)
                        ? subtitleTop - btnHeight - 16
                        : fallbackTop;
                    const minTop = 14;
                    const maxTop = Math.max(minTop, window.innerHeight - btnHeight - 16);
                    targetTop = Math.max(minTop, Math.min(maxTop, targetTop));
                    nextChapterBtn.style.setProperty('--next-btn-top', `${Math.round(targetTop)}px`);
                }

                function showNextChapterPrompt(reason = 'main-ended') {
                    if (!nextChapterBtn || isReadingMode) return;
                    nextChapterPromptShownAt = performance.now();
                    nextChapterPromptTrackbackReference = Number(player && player.currentTime) || 0;
                    nextChapterPromptActive = true;
                    nextChapterBtn.classList.add('visible');
                    positionNextChapterPrompt();
                    liminalTrace('ui:next-chapter:show', { reason });
                }

                function maybeHideNextChapterPromptForBackSeek(currentTime) {
                    if (!nextChapterPromptActive || !nextChapterBtn || !nextChapterBtn.classList.contains('visible')) return;
                    const now = performance.now();
                    const current = Number(currentTime);
                    if (!Number.isFinite(current)) return;
                    const previous = Number(nextChapterPromptTrackbackReference);
                    if (Number.isFinite(previous)) {
                        const movedBackEnough = (previous - current) > 1.3;
                        const likelyAutoResetAfterEnded =
                            (now - nextChapterPromptShownAt) < 1000
                            && current < 1.2
                            && !!player
                            && !!player.paused;
                        if (movedBackEnough && !likelyAutoResetAfterEnded) {
                            hideNextChapterPrompt('seek-back');
                            return;
                        }
                    }
                    nextChapterPromptTrackbackReference = current;
                }

                let modeSwitchSubtitleRenderToken = 0;
                let modeSwitchMotionSyncToken = 0;
                let modeSwitchDeferredReadingRenderPending = false;
                let modeSwitchDeferredReadingRenderTimer = null;

                function setReadingRenderPending(active) {
                    if (!uiContainer) return;
                    uiContainer.classList.toggle('reading-render-pending', !!active);
                }

                function clearModeSwitchDeferredReadingRenderTimer() {
                    if (!modeSwitchDeferredReadingRenderTimer) return;
                    clearTimeout(modeSwitchDeferredReadingRenderTimer);
                    modeSwitchDeferredReadingRenderTimer = null;
                }

                function flushDeferredReadingModeRender(reason = 'mode-switch') {
                    if (!modeSwitchDeferredReadingRenderPending) return;
                    if (!isReadingMode) {
                        modeSwitchDeferredReadingRenderPending = false;
                        clearModeSwitchDeferredReadingRenderTimer();
                        setReadingRenderPending(false);
                        return;
                    }
                    modeSwitchDeferredReadingRenderPending = false;
                    clearModeSwitchDeferredReadingRenderTimer();

                    const token = ++modeSwitchSubtitleRenderToken;
                    const run = () => {
                        if (token !== modeSwitchSubtitleRenderToken) return;
                        if (!isReadingMode || !window.audioPlayer) {
                            setReadingRenderPending(false);
                            return;
                        }
                        if (typeof window.audioPlayer.setReadingMode === 'function') {
                            window.audioPlayer.setReadingMode(true);
                            setReadingRenderPending(false);
                            return;
                        }
                        window.audioPlayer.isReadingMode = true;
                        if (typeof window.audioPlayer.renderLines === 'function') {
                            const idx = Number.isFinite(window.audioPlayer.currentSubtitleIndex)
                                ? window.audioPlayer.currentSubtitleIndex
                                : 0;
                            window.audioPlayer.renderLines(Math.max(0, idx));
                        }
                        setReadingRenderPending(false);
                    };

                    // For entering reading mode we render early (during camera centering).
                    if (reason === 'mode-enter-reading') {
                        requestAnimationFrame(run);
                        return;
                    }

                    if (typeof requestIdleCallback === 'function') {
                        requestIdleCallback(() => requestAnimationFrame(run), { timeout: 220 });
                    } else {
                        modeSwitchDeferredReadingRenderTimer = setTimeout(() => {
                            modeSwitchDeferredReadingRenderTimer = null;
                            requestAnimationFrame(run);
                        }, reason === 'center-complete' ? 70 : 100);
                    }
                }

                function queueDeferredReadingModeRender(reason = 'mode-switch') {
                    modeSwitchDeferredReadingRenderPending = true;
                    clearModeSwitchDeferredReadingRenderTimer();
                    setReadingRenderPending(true);
                    const tick = () => {
                        modeSwitchDeferredReadingRenderTimer = null;
                        if (!modeSwitchDeferredReadingRenderPending || !isReadingMode) return;
                        flushDeferredReadingModeRender(reason);
                    };
                    // Keep a tiny defer so old game-mode lines are never flashed,
                    // but show reading text while centering is still running.
                    modeSwitchDeferredReadingRenderTimer = setTimeout(tick, (window.fallback2DMode || !camera) ? 40 : 90);
                }

                function scheduleModeSwitchMotionSync(nextReadingMode) {
                    const token = ++modeSwitchMotionSyncToken;
                    const runSync = () => {
                        if (token !== modeSwitchMotionSyncToken) return;
                        try {
                            moveTarget = null;
                            cameraLookTarget = null;
                            isLookingAtClickTarget = false;
                            if (velocity && typeof velocity.set === 'function') velocity.set(0, 0, 0);
                            if (move) {
                                move.f = false;
                                move.b = false;
                                move.l = false;
                                move.r = false;
                            }
                            if (!nextReadingMode) {
                                isCenteringCamera = false;
                            }
                            if (typeof syncLookTargetsToCamera === 'function') syncLookTargetsToCamera();
                        } catch (_) {
                            // Variables may not be initialized yet during early boot.
                        }
                    };
                    if (typeof queueMicrotask === 'function') {
                        queueMicrotask(runSync);
                    } else {
                        Promise.resolve().then(runSync);
                    }
                }

                let lastAppliedReadingMode = null;

                function syncModeToggleButton() {
                    if (!modeToggleBtn) return;
                    const nextModeLabel = isReadingMode ? 'Spielmodus aktivieren' : 'Lesemodus aktivieren';
                    modeToggleBtn.title = nextModeLabel;
                    modeToggleBtn.setAttribute('aria-label', nextModeLabel);
                }


                function updateReadingModeUI(reason = 'manual', options = {}) {
                    if (!isReadingMode && globalVisualDimmer && globalVisualDimmer.isFrozen()) {
                        isReadingMode = true;
                    }
                    isReadingMode = !!isReadingMode;
                    const modeChanged = lastAppliedReadingMode !== isReadingMode;

                    // Sync with Shared Player
                    if (window.audioPlayer) {
                        window.audioPlayer.isReadingMode = isReadingMode;
                    }

                    if (modeChanged || options.force) {
                        if (isReadingMode) {
                            uiContainer.classList.add('reading-mode');
                            localStorage.setItem('gameboy_reading_mode', 'true');
                            isCenteringCamera = true;
                            queueDeferredReadingModeRender('mode-enter-reading');
                            hideNextChapterPrompt('reading-mode-on');
                        } else {
                            modeSwitchDeferredReadingRenderPending = false;
                            clearModeSwitchDeferredReadingRenderTimer();
                            setReadingRenderPending(false);
                            clearBlaetternPaginationRetryTimer();
                            setSubtitleFollowLocked(false);
                            if (window.SubtitleRichText && typeof window.SubtitleRichText.closeOverlay === 'function') {
                                window.SubtitleRichText.closeOverlay(true);
                            }
                            if (window.audioPlayer && typeof window.audioPlayer.setReadingMode === 'function') {
                                window.audioPlayer.setReadingMode(false);
                            }
                            uiContainer.classList.remove('reading-mode');
                            localStorage.setItem('gameboy_reading_mode', 'false');
                        }
                        lastAppliedReadingMode = isReadingMode;
                    }
                    syncModeDimmerLevel({ force: true });
                    syncModeToggleButton();
                    markBlaetternPaginationDirty();
                    syncBlaetternUiState(`mode-switch:${reason}`);
                    if (modeChanged || options.force) {
                        scheduleModeSwitchMotionSync(isReadingMode);
                    }
                    updateRecenterButtonVisibility();
                    updateLoreProgressHud();
                }

                function isPlayerTransportPaused() {
                    if (!player || !player.audio) return true;
                    if (typeof player.audio.isTransportPaused === 'function') {
                        return player.audio.isTransportPaused();
                    }
                    return !!player.paused;
                }

                // --- EVENT LISTENERS ---
                async function handleAudioToggleClick() {
                    if (contentSwitchInProgress) {
                        liminalTrace('ui:play-toggle:blocked', { reason: 'contentSwitchInProgress' });
                        return;
                    }
                    const wantsPlay = isPlayerTransportPaused();
                    liminalTrace('ui:play-toggle:click', {
                        wantsPlay,
                        paused: !!player.paused,
                        transportPaused: isPlayerTransportPaused(),
                        iconPlay: iconPlay.style.display,
                        iconPause: iconPause.style.display
                    });
                    if (nextChapterPromptActive) {
                        const tracks = getActiveSubtitleTracks();
                        const subtitleIdx = getActiveSubtitleIndex();
                        if (tracks.length > 0 && subtitleIdx < tracks.length - 1) {
                            hideNextChapterPrompt('play-toggle');
                        }
                    }
                    if (wantsPlay) {
                        iconPlay.style.display = 'none';
                        iconPause.style.display = 'block';
                        try {
                            await player.play();
                            liminalTrace('ui:play-toggle:play-called');
                        } catch (e) {
                            liminalDebugNote('toggle-error', e && e.message ? e.message : String(e));
                            liminalTrace('ui:play-toggle:play-error', { message: e && e.message ? e.message : String(e) });
                        }
                        setTimeout(updateIcons, 120);
                    } else {
                        player.pause();
                        liminalTrace('ui:play-toggle:pause-called');
                        updateIcons();
                    }
                }

                document.getElementById('audioToggleBtn').addEventListener('click', () => {
                    handleAudioToggleClick();
                });

                document.getElementById('skipBackBtn').addEventListener('click', () => {
                    if (contentSwitchInProgress) return;
                    markUiInteraction('btn:skip-back');
                    skipBySecondsInLiminal(-15);
                });
                document.getElementById('skipForwardBtn').addEventListener('click', () => {
                    if (contentSwitchInProgress) return;
                    markUiInteraction('btn:skip-forward');
                    skipBySecondsInLiminal(15);
                });

                modeToggleBtn.addEventListener('click', () => {
                    // In frozen mode: reset dimmer to off + switch to game mode
                    if (globalVisualDimmer && globalVisualDimmer.isFrozen()) {
                        globalVisualDimmer.setLevel(0, { forceEmit: true });
                        isReadingMode = false;
                    } else {
                        isReadingMode = !isReadingMode;
                    }
                    updateReadingModeUI('ui-mode-toggle');
                    markUiInteraction(
                        isReadingMode ? 'btn:reading-mode' : 'btn:game-mode',
                        { keepCentering: isReadingMode }
                    );
                });

                document.querySelectorAll('#audioControls button, #nextChapterBtn, #chapterMenu .menu-item').forEach(el => {
                    el.addEventListener('click', () => {
                        const name = el.id || el.className || 'ui';
                        liminalDebugNote('ui-click', String(name));
                    });
                });

                if (audioControlsEl) {
                    audioControlsEl.addEventListener('pointerdown', () => {
                        if (isBlaetternLayoutActive()) bumpBlaetternControlsAutoHide('controls-pointerdown');
                    });
                    audioControlsEl.addEventListener('click', () => {
                        if (isBlaetternLayoutActive()) bumpBlaetternControlsAutoHide('controls-click');
                    });
                }
                let lastDesktopBlaetternMousemoveAt = 0;
                let lastDesktopBlaetternMouseX = NaN;
                let lastDesktopBlaetternMouseY = NaN;
                document.addEventListener('mousemove', (event) => {
                    if (!isBlaetternLayoutActive()) return;
                    if (!isDesktopPointerLayout()) return;
                    const x = Number(event.clientX);
                    const y = Number(event.clientY);
                    if (!Number.isFinite(x) || !Number.isFinite(y)) return;

                    const movedEnough =
                        !Number.isFinite(lastDesktopBlaetternMouseX) ||
                        !Number.isFinite(lastDesktopBlaetternMouseY) ||
                        Math.hypot(x - lastDesktopBlaetternMouseX, y - lastDesktopBlaetternMouseY) >= 2;
                    if (!movedEnough) return;

                    const now = Date.now();
                    if (now - lastDesktopBlaetternMousemoveAt < 120) return;
                    lastDesktopBlaetternMousemoveAt = now;
                    lastDesktopBlaetternMouseX = x;
                    lastDesktopBlaetternMouseY = y;
                    bumpBlaetternControlsAutoHide('desktop-mousemove');
                });

                // Auto-Resume when Lore ends or Transition
                // SharedAudioPlayer ruft this.onEnded() auf wenn Audio endet.
                // ZusÃ¤tzlich addEventListener als Fallback falls SCAudioAdapter DOM-Events feuert.
                let _endedHandled = false;
                function handleAudioEnded() {
                    if (_endedHandled) return;
                    _endedHandled = true;
                    setTimeout(() => { _endedHandled = false; }, 500);

                    if (isLoreMode) {
                        liminalDebugNote('audio-ended', 'lore -> restore main');
                        liminalTrace('audio:ended:lore');
                        window.restoreMainAudio({ saveCurrent: false });
                        return;
                    }

                    // MAIN CHAPTER ENDED
                    // NOTE: SCAudioAdapter kann currentTime nach 'ended' auf 0 zurÃ¼cksetzen,
                    // daher isCurrentContentCompleted() NICHT verwenden (reachedAudioEnd wÃ¼rde false liefern).
                    const tracks = getActiveSubtitleTracks();
                    const subtitleIdx = getActiveSubtitleIndex();
                    const textFinished = tracks.length === 0 || subtitleIdx >= tracks.length - 1;
                    liminalDebugNote('audio-ended', `main idx=${subtitleIdx}/${tracks.length} textFinished=${textFinished} reading=${isReadingMode}`);
                    liminalTrace('audio:ended:main', {
                        textFinished: !!textFinished,
                        subtitleIndex: subtitleIdx,
                        subtitleCount: tracks.length,
                        readingMode: !!isReadingMode
                    });

                    clearContentState(MAIN_CONTENT_KEY);

                    if (isReadingMode) {
                        transitionToNextChapter();
                    } else {
                        showNextChapterPrompt('main-ended');
                    }
                }
                // PrimÃ¤r: SharedAudioPlayer.onEnded (garantiert aufgerufen)
                player.onEnded = handleAudioEnded;
                // Fallback: DOM-Event auf dem Audio-Element
                player.audio.addEventListener('ended', handleAudioEnded);
                player.audio.addEventListener('timeupdate', () => {
                    maybeHideNextChapterPromptForBackSeek(player.currentTime || 0);
                    positionNextChapterPrompt();
                });

                // Global Transition Logic
                window.transitionToNextChapter = async function () {
                    const overlay = document.getElementById('transitionOverlay');
                    if (overlay) overlay.classList.add('active');
                    await waitForContentSwitchIdle('transition:next-chapter');
                    await saveCurrentContentState({ reason: 'transition:next-chapter' });

                    // Mark autoplay intent so the next chapter auto-plays in reading mode
                    const targetPageKey = 'kapitel1c';
                    markChapterAutoplayIntent(targetPageKey, 'auto', 'chapter-transition');
                    writeStateHandoff(targetPageKey);

                    // Fade Audio
                    const fade = setInterval(() => {
                        if (player.volume > 0.05) player.volume -= 0.05;
                        else { clearInterval(fade); player.pause(); }
                    }, 100);

                    setTimeout(() => {
                        // Transition to Chapter 1c (Steingasse)
                        window.location.href = 'index.html?chapter=kapitel1c';
                    }, 2000);
                };

                nextChapterBtn = document.getElementById('nextChapterBtn');
                if (nextChapterBtn) nextChapterBtn.addEventListener('click', () => {
                    hideNextChapterPrompt('button-click');
                    transitionToNextChapter();
                });

                // RESTORE READING MODE STATE - MOVED TO TOP (Line 196)
                // ALWAYS update UI to sync player state
                updateReadingModeUI();
                refreshLoreProgressUi();

                // --- DRAG TO SCROLL LOGIC ---

                // SMART MASK LOGIC (Opacity on scroll)
                subtitleContainer.addEventListener('scroll', () => {
                    if (subtitleContainer.scrollTop > 10) {
                        subtitleContainer.classList.add('scrolled-state');
                    } else {
                        subtitleContainer.classList.remove('scrolled-state');
                    }
                });

                let isDown = false;
                let startY;
                let scrollTop;
                let lastMoveY = 0;
                let lastMoveTime = 0;
                let swipeVelocity = 0;
                let momentumAnimId = null;

                function cancelMomentum() {
                    if (momentumAnimId) {
                        cancelAnimationFrame(momentumAnimId);
                        momentumAnimId = null;
                    }
                }

                const getReaderPointerPageY = (event) => {
                    if (!event) return null;
                    if (event.touches && event.touches.length > 0) return event.touches[0].pageY;
                    if (event.changedTouches && event.changedTouches.length > 0) return event.changedTouches[0].pageY;
                    if (typeof event.pageY === 'number') return event.pageY;
                    return null;
                };

                const isReaderMultiTouchEvent = (event) => !!(event && event.touches && event.touches.length > 1);

                const cancelReaderDragInteraction = () => {
                    isDown = false;
                    subtitleContainer.dataset.isDragging = 'false';
                    subtitleContainer.style.cursor = 'auto';
                    swipeVelocity = 0;
                };

                const handleDown = (e) => {
                    if (!isReadingMode || isBlaetternLayoutActive()) return;
                    if (typeof e.button === 'number' && e.button !== 0) return;
                    if (isReaderMultiTouchEvent(e)) {
                        cancelReaderDragInteraction();
                        return;
                    }
                    cancelMomentum();
                    isDown = true;
                    subtitleContainer.dataset.isDragging = 'false';
                    subtitleContainer.dataset.wasDragging = 'false';
                    const pageY = getReaderPointerPageY(e);
                    if (!Number.isFinite(pageY)) {
                        cancelReaderDragInteraction();
                        return;

                    chapterMenuController.render();

                }

                // --- RESIZE HANDLER (Fixes Fullscreen FOV) ---
                window.addEventListener('resize', () => {
                    syncViewport();
                    console.log(`Resized to ${window.innerWidth}x${window.innerHeight}`);
                });
                window.addEventListener('orientationchange', syncViewport, { passive: true });
                document.addEventListener('fullscreenchange', syncViewport);
                if (window.visualViewport) {
                    window.visualViewport.addEventListener('resize', syncViewport, { passive: true });
                    window.visualViewport.addEventListener('scroll', syncViewport, { passive: true });
                }


            } catch (err) {
                console.error("FATAL ERROR IN MODULE:", err);
